<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildlife Info - Wildlife Spotter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      .result-card img { max-height: 200px; object-fit: cover; }
      .source-badge { position: absolute; top: 10px; right: 10px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Wildlife Spotter</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks">
          <!-- Filled by script.js -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Wildlife Information</h2>
        <div class="d-flex align-items-center">
            <label for="pageRegionSelect" class="me-2 fw-bold">Region:</label>
            <select id="pageRegionSelect" class="form-select w-auto">
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Europe">Europe</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Australia">Australia</option>
            </select>
        </div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs" id="infoTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="species-tab" data-bs-toggle="tab" data-bs-target="#species-pane" type="button" role="tab" aria-controls="species-pane" aria-selected="true">Species Encyclopedia</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="location-tab" data-bs-toggle="tab" data-bs-target="#location-pane" type="button" role="tab" aria-controls="location-pane" aria-selected="false">Location Guide</button>
      </li>
    </ul>

    <div class="tab-content mt-4" id="infoTabsContent">
      <!-- Species Tab -->
      <div class="tab-pane fade show active" id="species-pane" role="tabpanel" aria-labelledby="species-tab">
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="input-group">
                    <input type="text" id="speciesSearchInput" class="form-control" placeholder="Search for a species (e.g. Lion)...">
                    <button class="btn btn-primary" id="speciesSearchBtn">Search</button>
                </div>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#contributeModal">Contribute Entry</button>
            </div>
        </div>
        <div id="speciesResults" class="row">
            <!-- Results here -->
            <p class="text-muted text-center mt-5">Select a region and search for wildlife to learn more.</p>
        </div>
      </div>

      <!-- Location Tab -->
      <div class="tab-pane fade" id="location-pane" role="tabpanel" aria-labelledby="location-tab">
        <div class="row mb-4">
             <div class="col-md-12">
                <div class="input-group">
                    <input type="text" id="locationSearchInput" class="form-control" placeholder="Search for a National Park or location...">
                    <button class="btn btn-primary" id="locationSearchBtn">Search</button>
                </div>
            </div>
        </div>
        <div id="locationResults" class="row justify-content-center">
            <!-- Results here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Contribute Modal -->
  <div class="modal fade" id="contributeModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Contribute Species Entry</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="contributeForm">
                <div class="mb-3">
                    <label for="contributeName" class="form-label">Species Name</label>
                    <input type="text" class="form-control" id="contributeName" required>
                </div>
                <div class="mb-3">
                    <label for="contributeDesc" class="form-label">Description</label>
                    <textarea class="form-control" id="contributeDesc" rows="3"></textarea>
                </div>
                 <div class="mb-3">
                    <label for="contributeHabitat" class="form-label">Habitat</label>
                    <input type="text" class="form-control" id="contributeHabitat">
                </div>
                <div class="mb-3">
                    <label for="contributeScientific" class="form-label">Scientific Name</label>
                    <input type="text" class="form-control" id="contributeScientific">
                </div>
                 <div class="mb-3">
                    <label for="contributeDiet" class="form-label">Diet</label>
                    <input type="text" class="form-control" id="contributeDiet">
                </div>
                <div id="contributeMessage" style="display:none;" class="alert"></div>
                <button type="submit" class="btn btn-primary w-100">Submit Entry</button>
            </form>
          </div>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
