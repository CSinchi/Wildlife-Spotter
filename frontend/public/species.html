<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Species Details - Wildlife Spotter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      .sighting-card img { max-height: 200px; object-fit: cover; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Wildlife Spotter</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="navLinks">
          <!-- Filled by script.js -->
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <button class="btn btn-outline-secondary mb-3" onclick="history.back()">Back</button>
    <div id="speciesDetails" class="mb-5">
        <h2 id="speciesHeader">Loading...</h2>
        <div id="speciesContent"></div>
    </div>

    <h3>Recent Sightings</h3>
    <div id="speciesSightings" class="row">
        <p>Loading sightings...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
